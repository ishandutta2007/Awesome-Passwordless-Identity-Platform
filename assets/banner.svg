<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" ry="15"/>
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">
    Awesome Passwordless Identity Platform
  </text>
  <text x="50%" y="75%" font-family="Arial, sans-serif" font-size="20" fill="#e0e0e0" text-anchor="middle" dominant-baseline="middle">
    Curated List of SaaS Products &amp; Open-Source Projects
  </text>
  <circle cx="100" cy="100" r="10" fill="white">
    <animate attributeName="r" values="10; 20; 10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1; 0; 1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="100" r="10" fill="white">
    <animate attributeName="r" values="10; 20; 10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1; 0; 1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
